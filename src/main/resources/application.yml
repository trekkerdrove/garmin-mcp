server:
  port: ${PORT:8080}
spring:
  config:
    import: optional:file:.env[.properties]
  ai:
    mcp:
      server:
        name: garmin-mcp
        protocol: STATELESS
        streamable-http:
          mcp-endpoint: /mcp
        capabilities:
          resource: false
          prompt: false
          completion: false
garmin:
  api-key: ${GARMIN_API_KEY:}
  workouts:
    enabled: ${GARMIN_WORKOUT_WRITES_ENABLED:false}
    python: ${GARMIN_WORKOUT_PYTHON:/opt/garmin-python/bin/python}
    script: ${GARMIN_WORKOUT_SCRIPT:scripts/garmin_workout_bridge.py}
    token-directory: ${GARMIN_CONNECT_TOKEN_DIR:}
    session-file: ${GARMIN_CONNECT_SESSION_FILE:}
  courses:
    enabled: ${GARMIN_COURSES_ENABLED:false}
    writes-enabled: ${GARMIN_COURSE_WRITES_ENABLED:false}
    verified-edit-fields: ${GARMIN_COURSE_VERIFIED_EDIT_FIELDS:name}
    verified-point-types: ${GARMIN_COURSE_VERIFIED_POINT_TYPES:}
    verified-native-exports: ${GARMIN_COURSE_VERIFIED_NATIVE_EXPORTS:gpx}
    routing:
      url: ${GARMIN_COURSE_ORS_URL:}
      api-key: ${GARMIN_COURSE_ORS_KEY:}
      profiles: ${GARMIN_COURSE_ORS_PROFILES:}
      pelias-url: ${GARMIN_COURSE_PELIAS_URL:}
      pelias-key: ${GARMIN_COURSE_PELIAS_KEY:}
mcp:
  public-url: ${MCP_PUBLIC_URL:}
  oauth:
    issuer: ${MCP_OAUTH_ISSUER:}
    owner-subject: ${MCP_OAUTH_OWNER_SUBJECT:}
